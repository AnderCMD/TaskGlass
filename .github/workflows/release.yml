name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            GOOS=windows GOARCH=$arch go build -ldflags "-H=windowsgui -s -w -X main.version=$v" -o "dist/taskglass-windows-$arch.exe" ./cmd/taskglass
          done
          (cd dist && sha256sum *.exe > SHA256SUMS.txt)
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.exe dist/SHA256SUMS.txt --generate-notes
