name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)" || (gofmt -d . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - run: go build -ldflags "-H=windowsgui -s -w" -o dist/taskglass.exe ./cmd/taskglass
      - uses: actions/upload-artifact@v4
        with:
          name: taskglass-windows-amd64
          path: dist/taskglass.exe
