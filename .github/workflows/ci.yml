name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)" || (gofmt -d . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - run: go build -ldflags "-H=windowsgui -s -w" -o dist/taskglass.exe ./cmd/taskglass
      - name: Build native TAP
        shell: pwsh
        run: ./scripts/build-tap.ps1
      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version 0.0.0-ci
      - uses: actions/upload-artifact@v7
        with:
          name: taskglass-windows-amd64
          path: |
            dist/taskglass.exe
            dist/taskglass_tap.dll
            dist/*-Setup.exe
