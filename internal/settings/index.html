<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskGlass</title>
<style>
:root {
  --bg: #f3f3f3; --panel: #ffffff; --panel2: #f7f7f7; --line: #e1e1e1; --text: #1b1b1b; --muted: #5f5f5f;
  --accent: #0067c0; --accent-text: #ffffff; --danger: #c42b1c; --ok: #107c10; --shadow: 0 1px 2px rgba(0,0,0,.08);
  --focus: rgba(0,103,192,.35);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #202020; --panel: #2b2b2b; --panel2: #323232; --line: #3d3d3d; --text: #f2f2f2; --muted: #a8a8a8;
    --accent: #4cc2ff; --accent-text: #00263d; --danger: #ff99a4; --ok: #6ccb5f; --shadow: 0 1px 2px rgba(0,0,0,.4);
    --focus: rgba(76,194,255,.4);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
button, input, select { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 18px; margin: 0; font-weight: 600; flex: 1; }
.badge { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--accent); color: var(--accent-text); visibility: hidden; }
.badge.on { visibility: visible; }
.layout { display: grid; grid-template-columns: minmax(380px, 1fr) minmax(420px, 1.15fr); gap: 20px; padding: 20px 24px 90px; max-width: 1500px; margin: 0 auto; }
@media (max-width: 960px) { .layout { grid-template-columns: 1fr; } .preview-col { order: -1; position: static !important; } }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 14px; }
.tabs button { background: transparent; border: 0; padding: 8px 14px; border-radius: 8px; cursor: pointer; color: var(--muted); }
.tabs button:hover { background: var(--panel2); }
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px 18px; box-shadow: var(--shadow); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row.col { flex-direction: column; align-items: stretch; gap: 10px; }
.label { font-weight: 600; }
.help { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.warn { color: var(--danger); font-size: 12.5px; margin-top: 4px; }
select, input[type=text], input[type=number] { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; min-width: 190px; }
input[type=text] { min-width: 0; }
select:focus, input:focus, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
input[type=color] { width: 44px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; }
input[type=color]:disabled { opacity: .35; cursor: not-allowed; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.switch { position: relative; width: 42px; height: 22px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 999px; border: 1px solid var(--muted); background: transparent; transition: .15s; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); transition: .15s; }
.switch input:checked + i { background: var(--accent); border-color: var(--accent); }
.switch input:checked + i::after { left: 23px; background: var(--accent-text); }
.switch input:focus-visible + i { outline: 2px solid var(--focus); outline-offset: 2px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.cards button { text-align: left; border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.cards button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.cards .sw { height: 26px; border-radius: 6px; background: linear-gradient(120deg,#ff8a5c,#7a5cff 55%,#2fd3c6); position: relative; overflow: hidden; }
.cards .sw b { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; }
.cards .nm { font-weight: 600; }
.cards .ds { color: var(--muted); font-size: 12px; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--panel2); border-radius: 6px; padding: 7px 14px; cursor: pointer; }
.btn:hover { filter: brightness(.97); }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; font-weight: 600; }
.btn.primary:disabled { opacity: .45; cursor: default; }
.btn.danger { color: var(--danger); }
.inline { display: flex; align-items: center; gap: 10px; }
.num { width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.hidden { display: none !important; }
.apprule { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 12px 0; background: var(--panel2); display: grid; gap: 10px; }
.apprule .top { display: flex; gap: 10px; }
.apprule .top input[type=text] { flex: 1; }
footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 12px 24px; display: flex; gap: 10px; align-items: center; z-index: 6; }
footer .sp { flex: 1; }
.toast { color: var(--ok); font-weight: 600; opacity: 0; transition: opacity .2s; }
.toast.on { opacity: 1; }
.toast.err { color: var(--danger); }
.preview-col { position: sticky; top: 78px; align-self: start; display: grid; gap: 12px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: transparent; }
.title { font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
/* ---- desktop preview ---- */
.desk { position: relative; height: 330px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); isolation: isolate;
  background:
    radial-gradient(circle at 18% 78%, #ffd166 0 9%, transparent 22%),
    radial-gradient(circle at 48% 96%, #ef476f 0 12%, transparent 26%),
    radial-gradient(circle at 80% 88%, #06d6a0 0 12%, transparent 28%),
    radial-gradient(circle at 92% 20%, #118ab2 0 22%, transparent 50%),
    linear-gradient(135deg, #2b1b6b, #5b2a86 45%, #c74b8a); }
.desk.winmax::before { content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: 48px; background: linear-gradient(#f4f4f4, #e6e6e6); }
.desk.winmax::after { content: "▭  ✕"; position: absolute; right: 12px; top: 8px; color: #333; font-size: 13px; letter-spacing: 6px; }
.deskcap { position: absolute; left: 14px; top: 12px; color: rgba(255,255,255,.85); font-size: 12px; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
.desk.winmax .deskcap { color: #444; text-shadow: none; }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; display: flex; align-items: center; justify-content: center; color: #fff; overflow: hidden; }
.bar.light { color: #1b1b1b; }
.bar .fill { position: absolute; inset: 0; z-index: 0; }
.bar .noise { position: absolute; inset: 0; z-index: 0; opacity: 0; mix-blend-mode: overlay; }
.bar .icons { position: relative; z-index: 1; display: flex; gap: 6px; align-items: center; }
.bar .ic { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; }
.bar .tray { position: absolute; right: 10px; z-index: 1; display: flex; gap: 10px; align-items: center; font-size: 12px; }
.bar .tray .chev { padding: 3px 7px; border-radius: 6px; background: rgba(128,128,128,.25); }
.bar .tray .clock { text-align: right; line-height: 1.15; font-size: 11px; }
.flyout { position: absolute; right: 54px; bottom: 56px; width: 150px; padding: 10px; border-radius: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; color: #fff; z-index: 3; border: 1px solid rgba(255,255,255,.12); overflow: hidden; }
.flyout.light { color: #1b1b1b; }
.flyout .fill { position: absolute; inset: 0; z-index: 0; }
.flyout .g { position: relative; z-index: 1; height: 34px; border-radius: 8px; display: grid; place-items: center; font-size: 17px; background: rgba(128,128,128,.22); }
.flyout .lbl { position: absolute; z-index: 1; left: 10px; top: -1px; font-size: 0; }
.note { font-size: 12.5px; color: var(--muted); }
.hot { font-family: "Cascadia Mono", Consolas, monospace; }
</style>
</head>
<body>
<header>
  <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ae7ff"/><stop offset="1" stop-color="#6a5cff"/></linearGradient></defs><rect x="2" y="7" width="28" height="18" rx="5" fill="url(#lg)" opacity=".9"/><rect x="2" y="19" width="28" height="6" rx="3" fill="#fff" opacity=".55"/></svg>
  <h1 data-i18n="ui.title">TaskGlass</h1>
  <span class="badge" id="dirty" data-i18n="ui.unsaved"></span>
</header>

<div class="layout">
  <section>
    <nav class="tabs" role="tablist" id="tabs"></nav>

    <div class="card panel" data-panel="general">
      <div class="row"><div><div class="label" data-i18n="general.enabled"></div><div class="help" data-i18n="general.enabled.help"></div></div>
        <label class="switch"><input type="checkbox" data-k="enabled"><i></i></label></div>
      <div class="row"><div><div class="label" data-i18n="general.autostart"></div><div class="help" data-i18n="general.autostart.help"></div></div>
        <label class="switch"><input type="checkbox" id="autostart"><i></i></label></div>
      <div class="row"><div class="label" data-i18n="general.language"></div>
        <select data-k="language" data-opts="auto,en,es" data-prefix="language."></select></div>
      <div class="row"><div><div class="label" data-i18n="general.theme"></div><div class="help" data-i18n="general.theme.help"></div></div>
        <select data-k="theme" data-opts="auto,light,dark" data-prefix="theme."></select></div>
      <div class="row"><div class="label" data-i18n="general.taskbars"></div>
        <select data-k="taskbars" data-opts="all,primary" data-prefix="general.taskbars."></select></div>
      <div class="row"><div class="label" data-i18n="general.trayIcon"></div>
        <select data-k="tray_icon" data-opts="auto,color,light,dark" data-prefix="general.trayIcon."></select></div>
      <div class="row col">
        <div class="inline" style="justify-content:space-between"><div><div class="label" data-i18n="general.hotkey"></div><div class="help" data-i18n="general.hotkey.help"></div></div>
          <label class="switch" title=""><input type="checkbox" data-k="hotkey_enabled"><i></i></label></div>
        <div class="inline"><span data-i18n="general.hotkey.enable" class="help"></span><input type="text" class="hot" data-k="hotkey" id="hotkey" style="max-width:220px" spellcheck="false"></div>
        <div class="warn hidden" id="hotkeyWarn"></div>
      </div>
    </div>

    <div class="card panel hidden" data-panel="appearance">
      <div class="row col"><div class="label" data-i18n="appear.style"></div>
        <div id="defCards"></div></div>
      <div class="row col"><div class="label" data-i18n="appear.preset"></div>
        <div class="presets">
          <button class="btn" data-preset="glass" data-i18n="appear.preset.glass"></button>
          <button class="btn" data-preset="frosted" data-i18n="appear.preset.frosted"></button>
          <button class="btn" data-preset="acrylic" data-i18n="appear.preset.acrylic"></button>
          <button class="btn" data-preset="solid" data-i18n="appear.preset.solid"></button>
        </div></div>
      <div id="defTint"></div>
      <div class="row"><div><div class="label" data-i18n="appear.xaml"></div><div class="help" data-i18n="appear.xaml.help"></div><div class="warn hidden" id="xamlMissing" data-i18n="appear.xaml.missing"></div></div>
        <label class="switch"><input type="checkbox" data-k="xaml_fix"><i></i></label></div>
      <div class="row"><div><div class="label" data-i18n="appear.maxRule"></div><div class="help" data-i18n="appear.maxRule.help"></div></div>
        <label class="switch"><input type="checkbox" data-k="maximized.enabled"><i></i></label></div>
      <div id="maxBlock" class="hidden"><div class="row col"><div id="maxCards"></div></div><div id="maxTint"></div></div>
      <div class="row"><div class="help" data-i18n="appear.accentNote"></div></div>
    </div>

    <div class="card panel hidden" data-panel="tray">
      <div class="row"><div><div class="label" data-i18n="tray.surface"></div><div class="help" data-i18n="tray.surface.help"></div></div>
        <label class="switch"><input type="checkbox" data-k="surfaces.tray_overflow.enabled"><i></i></label></div>
      <div class="row col"><div><div class="label" data-i18n="tray.opacity"></div><div class="help" data-i18n="tray.opacity.help"></div></div>
        <div class="inline"><input type="range" min="0" max="100" data-k="surfaces.tray_overflow.opacity"><span class="num" data-num="surfaces.tray_overflow.opacity"></span></div></div>
    </div>

    <div class="card panel hidden" data-panel="apps">
      <div class="row col"><div><div class="label" data-i18n="apps.title"></div><div class="help" data-i18n="apps.help"></div></div>
        <div id="appList"></div>
        <div class="inline"><button class="btn" id="addApp" data-i18n="apps.add"></button><span class="help" id="appLimit"></span></div></div>
    </div>

    <div class="card panel hidden" data-panel="advanced">
      <div class="row"><div class="help" data-i18n="adv.help"></div></div>
      <div class="row"><div class="label" data-i18n="adv.poll"></div><input type="number" min="50" max="10000" step="10" data-k="poll_ms" data-int></div>
      <div class="row"><div class="label" data-i18n="adv.debounce"></div><input type="number" min="0" max="1000" step="5" data-k="debounce_ms" data-int></div>
      <div class="row"><div class="label" data-i18n="adv.refresh"></div><input type="number" min="100" max="60000" step="100" data-k="refresh_ms" data-int></div>
      <div class="row"><div class="label" data-i18n="adv.log"></div><select data-k="log_level" data-opts="debug,info,warn,error" data-raw></select></div>
      <div class="row"><div class="inline"><button class="btn" id="openCfg" data-i18n="adv.openConfig"></button><button class="btn" id="openLog" data-i18n="adv.openLog"></button></div></div>
    </div>

    <div class="card panel hidden" data-panel="about">
      <div class="row"><div class="label" data-i18n="about.version"></div><div id="ver"></div></div>
      <div class="row"><div data-i18n="about.license"></div></div>
      <div class="row"><div class="label" data-i18n="about.site"></div><a href="https://github.com/AnderCMD/TaskGlass" target="_blank" rel="noopener" style="color:var(--accent)">github.com/AnderCMD/TaskGlass</a></div>
      <div class="row"><div class="help hot" id="cfgPath"></div></div>
    </div>
  </section>

  <aside class="preview-col">
    <div class="title"><span data-i18n="ui.preview"></span><span class="note" data-i18n="ui.previewTaskbar"></span></div>
    <div class="seg" id="scenarios"></div>
    <div class="desk" id="desk">
      <div class="deskcap" id="deskcap"></div>
      <div class="flyout" id="flyout" aria-label="tray flyout"><div class="fill"></div>
        <div class="g">📶</div><div class="g">🔊</div><div class="g">🔋</div><div class="g">☁</div><div class="g">🎮</div><div class="g">🛡</div></div>
      <div class="bar" id="bar">
        <div class="fill" id="barFill"></div><div class="noise" id="barNoise"></div>
        <div class="icons">
          <div class="ic"><svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4cc2ff" d="M0 2.5 7.5 1.4v6.3H0zM8.5 1.3 18 0v7.7H8.5zM0 8.6h7.5v6.3L0 13.8zM8.5 8.6H18V16l-9.5-1.3z"/></svg></div>
          <div class="ic" style="background:rgba(128,128,128,.25)">🔍</div>
          <div class="ic" style="background:#e8453c"></div><div class="ic" style="background:#2d7ff9"></div>
          <div class="ic" style="background:#33b469"></div><div class="ic" style="background:#f5b301"></div>
        </div>
        <div class="tray"><span class="chev" id="chev">⌃</span><span>📶 🔊</span><span class="clock">10:42<br>20/11/2026</span></div>
      </div>
    </div>
    <div class="note" data-i18n="ui.previewNote"></div>
  </aside>
</div>

<footer>
  <button class="btn primary" id="save" data-i18n="ui.save"></button>
  <button class="btn" id="revert" data-i18n="ui.revert"></button>
  <span class="toast" id="toast"></span>
  <span class="sp"></span>
  <button class="btn danger" id="reset" data-i18n="ui.reset"></button>
</footer>

<script>
"use strict";
const TOKEN = "__TOKEN__";
let meta = null, cfg = null, savedCfg = "", savedAuto = false, auto = false, scenario = "desktop";
const TABS = ["general", "appearance", "tray", "apps", "advanced", "about"];
let tab = "general";
try { tab = sessionStorage.getItem("tab") || tab; } catch (e) {}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function curLang() {
  const l = cfg ? cfg.language : "auto";
  return l === "auto" ? (meta ? meta.systemLang : "en") : l;
}
function t(key, ...a) {
  const tbl = meta.i18n[curLang()] || meta.i18n.en;
  let s = tbl[key] ?? meta.i18n.en[key] ?? key, i = 0;
  return s.replace(/%[sd]/g, () => a[i++]);
}
async function api(path, body) {
  const r = await fetch(path, { method: body === undefined ? "GET" : "POST", headers: { "X-TaskGlass-Token": TOKEN, "Content-Type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const getPath = (o, p) => p.split(".").reduce((x, k) => x?.[k], o);
function setPath(o, p, v) { const ks = p.split("."); const last = ks.pop(); ks.reduce((x, k) => x[k], o)[last] = v; }

/* ---------- appearance editors (accent cards, colour, strength) ---------- */
const ACCENTS = ["clear", "blur", "acrylic", "opaque", "normal"];
function swatchStyle(a) {
  switch (a) {
    case "clear": return "background:transparent";
    case "blur": return "background:rgba(30,30,30,.35);backdrop-filter:blur(8px)";
    case "acrylic": return "background:rgba(30,30,30,.5);backdrop-filter:blur(12px) saturate(1.5)";
    case "opaque": return "background:#1c1c1c";
    default: return "background:rgba(40,40,40,.8)";
  }
}
function buildCards(host, prefix) {
  host.innerHTML = "";
  const wrap = document.createElement("div"); wrap.className = "cards";
  for (const a of ACCENTS) {
    const b = document.createElement("button");
    b.type = "button"; b.dataset.v = a; b.dataset.k = prefix + ".accent";
    b.innerHTML = `<div class="sw"><b style="${swatchStyle(a)}"></b></div><div class="nm"></div><div class="ds"></div>`;
    $(".nm", b).textContent = t("accent." + a);
    $(".ds", b).textContent = t("style." + a + ".desc");
    b.onclick = () => { setPath(cfg, prefix + ".accent", a); onChange(); };
    wrap.appendChild(b);
  }
  host.appendChild(wrap);
}
function buildTint(host, prefix) {
  host.innerHTML = `
    <div class="row"><div class="label"></div>
      <div class="inline"><label class="inline"><span class="help"></span><span class="switch"><input type="checkbox" data-auto><i></i></span></label><input type="color" data-color></div></div>
    <div class="row col"><div><div class="label"></div><div class="help"></div></div>
      <div class="inline"><input type="range" min="0" max="100" data-op><span class="num" data-opn></span></div></div>`;
  const L = $$(".label", host), H = $$(".help", host);
  L[0].textContent = t("appear.color"); H[0].textContent = t("appear.colorAuto");
  L[1].textContent = t("appear.opacity"); H[1].textContent = t("appear.opacity.help");
  const auto = $("[data-auto]", host), col = $("[data-color]", host), op = $("[data-op]", host);
  auto.onchange = () => { setPath(cfg, prefix + ".color", auto.checked ? "auto" : (col.value || "#1c1c1c")); onChange(); };
  col.oninput = () => { setPath(cfg, prefix + ".color", col.value); onChange(); };
  op.oninput = () => { setPath(cfg, prefix + ".opacity", +op.value); onChange(); };
  host._sync = () => {
    const c = getPath(cfg, prefix + ".color"), isAuto = String(c).toLowerCase() === "auto";
    auto.checked = isAuto; col.disabled = isAuto;
    col.value = isAuto ? (isLight() ? "#f3f3f3" : "#1c1c1c") : "#" + String(c).replace("#", "").toLowerCase();
    op.value = getPath(cfg, prefix + ".opacity"); $("[data-opn]", host).textContent = op.value;
    const ac = getPath(cfg, prefix + ".accent");
    op.disabled = ac === "normal"; col.style.visibility = ac === "normal" ? "hidden" : "visible";
  };
}
function syncTint(host) { host._sync && host._sync(); }

/* ---------- app rules ---------- */
function renderApps() {
  const list = $("#appList"); list.innerHTML = "";
  if (!cfg.apps.length) { const p = document.createElement("div"); p.className = "help"; p.textContent = t("apps.empty"); list.appendChild(p); }
  cfg.apps.forEach((r, i) => {
    const box = document.createElement("div"); box.className = "apprule";
    box.innerHTML = `<div class="top"><input type="text" spellcheck="false"><button class="btn danger" type="button"></button></div><div data-c></div><div data-t></div>`;
    const inp = $("input", box); inp.value = r.exe; inp.placeholder = t("apps.exe");
    inp.oninput = () => { r.exe = inp.value.trim(); onChange(); };
    const rm = $("button", box); rm.textContent = t("apps.remove");
    rm.onclick = () => { cfg.apps.splice(i, 1); if (scenario === "app:" + i) scenario = "desktop"; renderApps(); onChange(); };
    list.appendChild(box);
    buildCards($("[data-c]", box), "apps." + i); buildTint($("[data-t]", box), "apps." + i);
  });
  $("#addApp").disabled = cfg.apps.length >= meta.maxApps;
  $("#appLimit").textContent = t("apps.limit", meta.maxApps);
  syncAll();
}

/* ---------- preview ---------- */
function isLight() {
  if (cfg.theme === "light") return true;
  if (cfg.theme === "dark") return false;
  return matchMedia("(prefers-color-scheme: light)").matches;
}
function rgbOf(color, light) {
  let c = String(color).toLowerCase();
  if (c === "auto") c = light ? "#f3f3f3" : "#1c1c1c";
  c = c.replace("#", "");
  return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16) || 0);
}
const NOISE = "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>\")";
function currentAppearance() {
  if (!cfg.enabled) return { accent: "normal", color: "auto", opacity: 100, disabled: true };
  if (scenario === "maximized" && cfg.maximized.enabled) return cfg.maximized;
  if (scenario.startsWith("app:")) { const r = cfg.apps[+scenario.slice(4)]; if (r) return r; }
  return cfg.default;
}
function paintPreview() {
  const light = isLight(), ap = currentAppearance(), bar = $("#bar"), fill = $("#barFill"), noise = $("#barNoise"), desk = $("#desk");
  bar.classList.toggle("light", light);
  desk.classList.toggle("winmax", scenario === "maximized" && cfg.maximized.enabled && cfg.enabled);
  let [r, g, b] = rgbOf(ap.color, light), a = ap.opacity / 100;
  let css = "", blur = "", nz = 0;
  switch (ap.accent) {
    case "clear": css = `rgba(${r},${g},${b},${a})`; break;
    case "blur": css = `rgba(${r},${g},${b},${a})`; blur = "blur(14px)"; break;
    case "acrylic": css = `rgba(${r},${g},${b},${a})`; blur = "blur(26px) saturate(1.7)"; nz = .35; break;
    case "opaque": css = `rgba(${r},${g},${b},${a})`; break;
    default: css = light ? "rgba(243,243,243,.82)" : "rgba(28,28,28,.82)"; blur = "blur(28px) saturate(1.4)"; nz = .2;
  }
  // Without the XAML fix Windows 11 keeps its own grey fill on top of the effect.
  const stockFill = !ap.disabled && ap.accent !== "normal" && ap.accent !== "opaque" && !(cfg.xaml_fix && meta.xamlAvailable);
  fill.style.background = stockFill ? `linear-gradient(${light ? "rgba(243,243,243,.55)" : "rgba(32,32,32,.55)"},${light ? "rgba(243,243,243,.55)" : "rgba(32,32,32,.55)"}),${css}` : css;
  fill.style.backdropFilter = fill.style.webkitBackdropFilter = blur;
  noise.style.backgroundImage = NOISE; noise.style.opacity = nz;
  // hidden-icons flyout
  const fly = $("#flyout"), s = cfg.surfaces.tray_overflow, on = cfg.enabled && s.enabled && meta.xamlAvailable !== false;
  fly.classList.toggle("light", light);
  const fa = on ? s.opacity / 100 : .92, base = light ? "243,243,243" : "36,36,36";
  const ff = $(".fill", fly); ff.style.background = `rgba(${base},${fa})`; ff.style.backdropFilter = `blur(${on ? 24 : 40}px) saturate(1.5)`;
  fly.style.borderColor = light ? "rgba(0,0,0,.12)" : "rgba(255,255,255,.12)";
  $("#deskcap").textContent = ap.disabled ? "Windows" : t("accent." + ap.accent);
}
function renderScenarios() {
  const box = $("#scenarios"); box.innerHTML = "";
  const add = (id, label) => { const b = document.createElement("button"); b.type = "button"; b.textContent = label; b.setAttribute("aria-pressed", scenario === id); b.onclick = () => { scenario = id; renderScenarios(); paintPreview(); }; box.appendChild(b); };
  add("desktop", t("ui.previewTaskbar"));
  if (cfg.maximized.enabled) add("maximized", t("ui.previewMax"));
  cfg.apps.forEach((r, i) => { if (r.exe) add("app:" + i, t("ui.previewApp", r.exe)); });
  if (!$$("button", box).some(b => b.getAttribute("aria-pressed") === "true")) { scenario = "desktop"; $("button", box).setAttribute("aria-pressed", "true"); }
}

/* ---------- binding ---------- */
function fillOptions() {
  $$("select[data-opts]").forEach(sel => {
    const v = getPath(cfg, sel.dataset.k);
    sel.innerHTML = "";
    sel.dataset.opts.split(",").forEach(o => {
      const op = document.createElement("option"); op.value = o;
      op.textContent = "raw" in sel.dataset ? o : t(sel.dataset.prefix + o); sel.appendChild(op);
    });
    sel.value = v;
  });
}
let shownLang = "";
function applyI18n() {
  shownLang = curLang();
  document.documentElement.lang = shownLang;
  document.title = t("ui.title");
  $$("[data-i18n]").forEach(e => e.textContent = t(e.dataset.i18n));
  $("#tabs").innerHTML = "";
  TABS.forEach(id => {
    const b = document.createElement("button"); b.type = "button"; b.role = "tab"; b.textContent = t("ui.tab." + id);
    b.setAttribute("aria-selected", id === tab); b.onclick = () => showTab(id); $("#tabs").appendChild(b);
  });
  fillOptions();
  buildCards($("#defCards"), "default"); buildCards($("#maxCards"), "maximized");
  buildTint($("#defTint"), "default"); buildTint($("#maxTint"), "maximized");
  renderApps(); renderScenarios();
}
function showTab(id) {
  tab = id; try { sessionStorage.setItem("tab", id); } catch (e) {}
  $$(".panel").forEach(p => p.classList.toggle("hidden", p.dataset.panel !== id));
  $$("#tabs button").forEach((b, i) => b.setAttribute("aria-selected", TABS[i] === id));
}
function syncAll() {
  $$("[data-k]").forEach(e => {
    if (e.tagName === "BUTTON") { e.setAttribute("aria-pressed", getPath(cfg, e.dataset.k) === e.dataset.v); return; }
    if (e.id === "hotkey" && document.activeElement === e) return;
    const v = getPath(cfg, e.dataset.k);
    if (e.type === "checkbox") e.checked = !!v; else if (document.activeElement !== e || e.tagName === "SELECT") e.value = v;
  });
  $$("[data-num]").forEach(e => e.textContent = getPath(cfg, e.dataset.num));
  $("#autostart").checked = auto;
  $("#maxBlock").classList.toggle("hidden", !cfg.maximized.enabled);
  $("#xamlMissing").classList.toggle("hidden", meta.xamlAvailable);
  ["#defTint", "#maxTint"].forEach(s => syncTint($(s)));
  $$("#appList .apprule").forEach(b => syncTint($("[data-t]", b)));
  $$("[data-c]").forEach(h => $$("button", h).forEach(x => x.setAttribute("aria-pressed", getPath(cfg, x.dataset.k) === x.dataset.v)));
  const hk = $("#hotkeyWarn"), ok = /^((ctrl|control|alt|shift|win|windows|super)\+)+([a-z0-9]|f([1-9]|1[0-9]|2[0-4]))$/i.test(cfg.hotkey.replace(/\s/g, ""));
  hk.classList.toggle("hidden", ok); hk.textContent = ok ? "" : t("general.hotkey.help");
  const dirty = JSON.stringify(cfg) !== savedCfg || auto !== savedAuto;
  $("#dirty").classList.toggle("on", dirty); $("#save").disabled = !dirty || !ok; $("#revert").disabled = !dirty;
}
function onChange() {
  if (curLang() !== shownLang) applyI18n();
  renderScenarios(); paintPreview(); syncAll();
}
function bindStatic() {
  $$("[data-k]:not(button)").forEach(e => {
    const k = e.dataset.k;
    const handler = () => {
      let v = e.type === "checkbox" ? e.checked : e.value;
      if (e.type === "range" || "int" in e.dataset) v = +v;
      setPath(cfg, k, v); onChange();
    };
    e.addEventListener(e.tagName === "SELECT" || e.type === "checkbox" ? "change" : "input", handler);
  });
  $("#autostart").onchange = e => { auto = e.target.checked; onChange(); };
  $$("[data-preset]").forEach(b => b.onclick = () => {
    const P = { glass: ["clear", 0], frosted: ["blur", 35], acrylic: ["acrylic", 55], solid: ["opaque", 100] }[b.dataset.preset];
    cfg.default.accent = P[0]; cfg.default.opacity = P[1]; onChange();
  });
  $("#addApp").onclick = () => { cfg.apps.push({ exe: "", accent: "opaque", color: "auto", opacity: 100 }); renderApps(); onChange(); const ins = $$("#appList input[type=text]"); ins[ins.length - 1]?.focus(); };
  $("#openCfg").onclick = () => api("/api/open", { what: "config" }).catch(e => toast(e.message, true));
  $("#openLog").onclick = () => api("/api/open", { what: "log" }).catch(e => toast(e.message, true));
  $("#revert").onclick = () => { cfg = JSON.parse(savedCfg); auto = savedAuto; applyI18n(); onChange(); };
  $("#reset").onclick = async () => {
    if (!confirm(t("ui.resetConfirm"))) return;
    cfg = await api("/api/defaults", {}); applyI18n(); onChange();
  };
  $("#save").onclick = save;
  addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); if (!$("#save").disabled) save(); } });
  matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => { onChange(); });
}
let toastTimer;
function toast(msg, err) {
  const el = $("#toast"); el.textContent = msg; el.classList.toggle("err", !!err); el.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), err ? 6000 : 2200);
}
async function save() {
  try {
    cfg.apps = cfg.apps.filter(r => r.exe && r.exe.trim());
    const res = await api("/api/config", cfg);
    if (auto !== savedAuto) { const r = await api("/api/autostart", { on: auto }); auto = r.autostart; }
    cfg = res.config; savedCfg = JSON.stringify(cfg); savedAuto = auto;
    applyI18n(); onChange(); toast(t("ui.saved"));
  } catch (e) { toast(t("ui.saveFailed", e.message), true); }
}
async function init() {
  meta = await api("/api/state");
  cfg = meta.config; savedCfg = JSON.stringify(cfg); auto = savedAuto = meta.autostart;
  $("#ver").textContent = meta.version; $("#cfgPath").textContent = meta.configPath;
  bindStatic(); applyI18n(); showTab(TABS.includes(tab) ? tab : "general"); onChange();
  history.replaceState(null, "", location.pathname);
}
init().catch(e => { document.body.textContent = "TaskGlass: " + e.message; });
</script>
</body>
</html>
