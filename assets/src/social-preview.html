<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1280px;height:640px;overflow:hidden;background:#0b1020}
  .wrap{position:relative;width:1280px;height:640px;overflow:hidden;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
    background:radial-gradient(1000px 600px at 85% 0%,#3b63e8bb,transparent 62%),radial-gradient(900px 520px at 0% 100%,#10b5c666,transparent 60%),radial-gradient(500px 300px at 55% 50%,#8b5cf633,transparent 70%),linear-gradient(135deg,#0a0f22,#13204a 55%,#0f3157)}
  .logo{position:absolute;left:520px;top:62px;width:240px;height:240px;filter:drop-shadow(0 24px 50px #0009)}
  h1{position:absolute;left:0;right:0;top:318px;margin:0;text-align:center;font-size:112px;font-weight:700;letter-spacing:-2.5px;color:#fff;line-height:1}
  h1 span{background:linear-gradient(90deg,#8fb0ff,#4de0f0);-webkit-background-clip:text;color:transparent}
  p{position:absolute;left:0;right:0;top:446px;margin:0;text-align:center;font-size:36px;color:#b3c4e6}
  .bar{position:absolute;left:0;right:0;bottom:0;height:78px;background:linear-gradient(#ffffff14,#ffffff05);border-top:1.5px solid #ffffff40;display:flex;align-items:center;justify-content:center;gap:34px}
  .bar b{width:40px;height:40px;border-radius:12px;background:#fff;display:block;box-shadow:0 4px 14px #0006}
  .bar b:nth-child(3n){background:#8fe9f5}.bar b:nth-child(4n){background:#b9c8ff}
  .tag{position:absolute;right:28px;bottom:94px;font-size:18px;color:#ffffffaa;letter-spacing:.3px}
</style></head><body>
<div class="wrap">
  <img class="logo" src="logo.svg">
  <h1>Task<span>Glass</span></h1>
  <p>Make the Windows taskbar disappear. Keep the icons.</p>
  <div class="tag">github.com/AnderCMD/TaskGlass</div>
  <div class="bar"><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div>
</div></body></html>
