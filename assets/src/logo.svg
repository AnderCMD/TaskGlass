<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>TaskGlass</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B7CFF"/>
      <stop offset="0.55" stop-color="#3C9DF2"/>
      <stop offset="1" stop-color="#19C6D9"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
    <clipPath id="clip"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="410" cy="70" r="190" fill="#FFFFFF" opacity="0.13"/>
    <path d="M0 0H512V170C380 128 190 196 0 140Z" fill="#FFFFFF" opacity="0.10"/>
  </g>
  <!-- a window floating above the bar -->
  <rect x="112" y="92" width="288" height="188" rx="30" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3"/>
  <rect x="112" y="92" width="288" height="44" rx="30" fill="#FFFFFF" opacity="0.22"/>
  <circle cx="146" cy="114" r="7" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="170" cy="114" r="7" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="194" cy="114" r="7" fill="#FFFFFF" opacity="0.5"/>
  <!-- the glass taskbar: translucent, only the icons stay solid -->
  <rect x="52" y="318" width="408" height="130" rx="42" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="3"/>
  <rect x="104" y="354" width="58" height="58" rx="17" fill="#FFFFFF"/>
  <rect x="227" y="354" width="58" height="58" rx="17" fill="#FFFFFF"/>
  <rect x="350" y="354" width="58" height="58" rx="17" fill="#FFFFFF"/>
</svg>
