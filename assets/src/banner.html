<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1280px;height:320px;overflow:hidden;background:#0b1020}
  .wrap{position:relative;width:1280px;height:320px;overflow:hidden;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
    background:radial-gradient(900px 420px at 88% -10%,#2a56d6aa,transparent 60%),radial-gradient(700px 360px at 5% 120%,#14b8c855,transparent 60%),linear-gradient(120deg,#0b1020,#111a38 60%,#0e2a4a)}
  .logo{position:absolute;left:64px;top:48px;width:224px;height:224px;filter:drop-shadow(0 18px 40px #0008)}
  h1{position:absolute;left:330px;top:58px;margin:0;font-size:104px;font-weight:700;letter-spacing:-2px;color:#fff;line-height:1}
  h1 span{background:linear-gradient(90deg,#8fb0ff,#4de0f0);-webkit-background-clip:text;color:transparent}
  p{position:absolute;left:334px;top:178px;margin:0;font-size:34px;color:#a9bbe0;font-weight:400}
  .chips{position:absolute;left:334px;top:244px;display:flex;gap:12px}
  .chips i{font-style:normal;font-size:20px;color:#cfe0ff;padding:7px 16px;border-radius:999px;background:#ffffff14;border:1px solid #ffffff2a}
  .bar{position:absolute;right:56px;bottom:34px;height:64px;width:300px;border-radius:22px;background:linear-gradient(#ffffff2e,#ffffff12);border:1.5px solid #ffffff55;display:flex;align-items:center;justify-content:space-around;padding:0 18px;box-sizing:border-box}
  .bar b{width:30px;height:30px;border-radius:9px;background:#fff;display:block}
</style></head><body>
<div class="wrap">
  <img class="logo" src="logo.svg">
  <h1>Task<span>Glass</span></h1>
  <p>A transparent taskbar for Windows 10 &amp; 11</p>
  <div class="chips"><i>Open source</i><i>Go</i><i>Light &amp; dark aware</i><i>MIT</i></div>
  <div class="bar"><b></b><b></b><b></b><b></b><b></b></div>
</div></body></html>
